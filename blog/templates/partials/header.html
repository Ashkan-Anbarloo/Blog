{% if  request.user.is_authenticated%}
<div>
    <a href='{% url "blog:page_account" %}'>{{request.user.first_name | default:request.user.username}}</a>
</div>
{% else %}
    <a href='{% url "blog:login" %}'>Log in</a>
    <a href='{% url "blog:register" %}'>register_User</a>
{% endif %}
<br>
<form method='get' action='{% url "blog:post_search" %}'>
    {% comment %} {% csrf_token %} {% endcomment %}
    <input type='text' name='query' required>
    <input type='submit' value='Search'>
</form>
<p><a href='{% url "blog:profile" %}'>Profile</a></p>
<br>
